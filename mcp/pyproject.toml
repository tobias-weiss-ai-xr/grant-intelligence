[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # Zeilenlänge + deutsche Typographie (En-Dash) bewusst

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101"]  # assert in Tests erlaubt

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["__pycache__", ".pytest_cache"]

[[tool.mypy.overrides]]
module = ["playwright.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "--strict-markers"
filterwarnings = [
    # starlette formparsers importiert intern 'multipart' statt 'python_multipart'
    # (Bibliothek-intern; verschwindet mit neuem starlette-Release)
    "ignore:Please use `import python_multipart` instead.*:PendingDeprecationWarning",
    # FastMCP-Settings-Feld 'lifespan' hat einen Forward-Ref, den pydantic-settings
    # erst bei model_rebuild() aufloesen kann (mcp-Paket, nicht unser Code)
    "ignore:Field 'lifespan' has an incomplete definition.*",
]

[tool.coverage.run]
source = ["mcp"]
branch = true
omit = ["test_*", "conftest.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
