[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # Zeilenlänge + deutsche Typographie (En-Dash) bewusst

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101"]  # assert in Tests erlaubt

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["__pycache__", ".pytest_cache"]

[tool.pytest.ini_options]
testpaths = ["."]
