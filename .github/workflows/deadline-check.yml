name: Deadline Check

on:
  schedule:
    # Sonntag 06:00 UTC (Empfehlung aus cron_check_expired.sh)
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: deadline
  cancel-in-progress: false

jobs:
  deadline-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compute deadline digest
        run: python mcp/deadline_digest.py --out mcp/deadline-digest.json

      - name: Commit digest (if changed)
        run: |
          git add mcp/deadline-digest.json
          if git diff --cached --quiet; then
            echo "No digest changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: deadline digest $(date -u +%Y-%m-%d)"
            git push
            echo "Digest committed."
          fi

      - name: Render issue body
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/deadline_issue_body.py

      - name: Open/update issue for new urgent deadlines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW=$(python -c "import json; print(json.load(open('mcp/deadline-digest.json')).get('neu_urgent', 0))")
          if [ "$NEW" = "0" ] || [ -z "$NEW" ]; then
            echo "No new urgent deadlines — no issue needed."
            exit 0
          fi
          # Label sicherstellen
          gh label create deadline-warning \
            --color "B85D00" \
            --description "Dringende Frist-Warnung" >/dev/null 2>&1 || true
          # Vorhandenes offenes Issue mit dem Label aktualisieren, sonst neu öffnen
          EXISTING=$(gh issue list --label deadline-warning --state open \
            --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file .github/deadline-issue-body.md
            echo "Updated existing issue #$EXISTING."
          else
            gh issue create \
              --title "🔴 Frist-Warnung: $NEW neue dringende Frist(en)" \
              --label deadline-warning \
              --body-file .github/deadline-issue-body.md
            echo "Created new issue."
          fi
